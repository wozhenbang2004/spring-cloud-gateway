name: FormFilter regression validation
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  form-filter:
    name: FormFilterTests (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - scenario: before-fix
            source-ref: 63a1996a1813991b46b663d888f000f9d72c75ce
          - scenario: after-fix
            source-ref: c5fcb4ddef2de2de0a117d7c436449c1b07d36a5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source-ref }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run FormFilterTests
        run: ./mvnw -s .settings.xml -B -U -Pspring -pl spring-cloud-gateway-server-webmvc -am -Dtest=FormFilterTests -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Verify committed source formatting
        if: always()
        run: git diff --exit-code
